app.name=Contact Management System
app.version=1.0.0
app.group=Group 17
app.course=CSE2003 Object Oriented Programming in Java

# Database DataSource Configuration (MySQL 8.0+)
spring.datasource.url=jdbc:mysql://localhost:3306/java_fullstack?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=MyNewPrivatePassword_2026!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Persistence & Storage
# Options: FILE_PERSISTENT (zero external setup, portable) | MYSQL_DATABASE (relational DB)
storage.default-engine=FILE_PERSISTENT

# Auto-Save Daemon
autosave.enabled=true
autosave.interval-seconds=45
